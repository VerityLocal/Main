schema_version: "1.0.0"
winnowing:
  k_gram_size: 5
  window_size: 4
minhash:
  permutations: 128
  bands: 16
  rows: 8
dense:
  max_tokens: 512
  normalize_embeddings: true
  similarity: cosine
rrf:
  k0: 60
external_search:
  enabled: false
  requires_explicit_consent: true
# These are proposed starting hyperparameters, not benchmarked configurations.
