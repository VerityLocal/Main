name: Native Windows Standard acceptance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\product\.local\browsers
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Last CPython 3.11 Windows binary available in the actions manifest.
          python-version: "3.11.9"
          architecture: x64
      - name: Install build-only dependencies
        run: |
          python -m pip install --only-binary=:all: torch==2.7.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: -r product/desktop-lock.txt -r product/build-requirements.txt
          python -m playwright install chromium --only-shell
      - name: Unit, engine and real Tk tests
        run: python -m unittest discover -s product/tests -p "test_*.py"
      - name: Assemble pinned Standard models and native executable
        run: |
          python -m product.packaging.prepare --output product/.local/desktop-bundle --browsers product/.local/browsers
          python -m product.packaging.build --bundle product/.local/desktop-bundle --output product/dist/standard-windows
      - name: Execute actual frozen Windows GUI and genuine offline models
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "product/dist/standard-windows/Verity/Verity.exe" -ArgumentList "--acceptance-output test-results/windows-frozen" -PassThru
          if (-not $p.WaitForExit(360000)) { $p.Kill(); throw "Frozen GUI timeout" }
          $r = Get-Content test-results/windows-frozen/acceptance.json | ConvertFrom-Json
          if (-not $r.passed -or -not $r.frozen) { throw "Frozen app acceptance failed" }
      - name: Archive and verify all shipped model bytes
        run: python -m product.packaging.archive --app product/dist/standard-windows/Verity --acceptance test-results/windows-frozen/acceptance.json --zip product/dist/downloads/Verity-Standard-Windows-x64.zip --report test-results/windows-archive.json
      - name: Re-extract and test the actual ZIP executable
        shell: pwsh
        run: |
          Expand-Archive product/dist/downloads/Verity-Standard-Windows-x64.zip test-results/windows-extracted
          $p = Start-Process -FilePath "test-results/windows-extracted/Verity/Verity.exe" -ArgumentList "--acceptance-output test-results/windows-reextracted" -PassThru
          if (-not $p.WaitForExit(360000)) { $p.Kill(); throw "Re-extracted GUI timeout" }
          $r = Get-Content test-results/windows-reextracted/acceptance.json | ConvertFrom-Json
          if (-not $r.passed -or -not $r.frozen) { throw "ZIP app acceptance failed" }
      - name: Upload accepted release candidate and privacy-safe reports
        uses: actions/upload-artifact@v4
        with:
          name: Verity-Standard-Windows-x64
          compression-level: 0
          retention-days: 7
          path: |
            product/dist/downloads/Verity-Standard-Windows-x64.zip
            test-results/windows-frozen/acceptance.json
            test-results/windows-reextracted/acceptance.json
            test-results/windows-archive.json
      - name: Upload diagnostic acceptance reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-acceptance-diagnostics
          path: test-results/**/acceptance.json
          if-no-files-found: ignore
