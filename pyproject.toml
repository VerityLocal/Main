[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-ai-analysis-platform"
version = "0.1.0"
description = "Private local document analysis and a Chrome MV3 extension"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "psutil==7.0.0",
  "PyYAML==6.0.2",
  "regex==2024.11.6",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
ml = [
  "torch==2.7.0", "transformers==4.51.3", "sentence-transformers==4.1.0",
  "peft==0.15.2", "numpy==1.26.4", "scikit-learn==1.6.1", "sentencepiece==0.2.0",
  "spacy==3.7.5",
]
ml-cuda = [
  "torch==2.7.0", "transformers==4.51.3", "sentence-transformers==4.1.0",
  "peft==0.15.2", "numpy==1.26.4", "scikit-learn==1.6.1", "sentencepiece==0.2.0",
  "spacy==3.7.5",
]
faiss = ["faiss-cpu==1.11.0", "numpy==1.26.4"]
export = ["onnx==1.17.0", "onnxruntime==1.21.1"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "pytest==8.3.5",
  "ruff==0.11.9",
]

[project.scripts]
local-ai-server = "backend.app.main:run"
local-ai-init = "backend.scripts.init_local:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["resource: bounded-resource or synthetic memory guard checks"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv-cuda"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
required-version = "==0.6.17"
conflicts = [[{ extra = "ml" }, { extra = "ml-cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "ml" },
  { index = "pytorch-cu126", extra = "ml-cuda" },
]
